[client]
port=3307
host=127.0.0.1

[mysqld]
port=3307
bind-address=127.0.0.1
basedir=C:/xampp/mysql
datadir=C:/xampp/htdocs/bibliotheque/project/mariadb-data
tmpdir=C:/xampp/htdocs/bibliotheque/project/mariadb-tmp
socket=mysql-bibliotheque
pid_file=bibliotheque-mysql.pid
log_error=C:/xampp/htdocs/bibliotheque/project/mariadb-data/mysql_error.log
plugin_dir=C:/xampp/mysql/lib/plugin/
character-set-server=utf8mb4
collation-server=utf8mb4_general_ci
default-storage-engine=InnoDB
innodb_buffer_pool_size=64M
innodb_log_file_size=16M
innodb_flush_log_at_trx_commit=1
max_allowed_packet=16M
sql_mode=NO_ZERO_IN_DATE,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION
